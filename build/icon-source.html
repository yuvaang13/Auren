<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: transparent; }
  .icon {
    width: 1024px; height: 1024px;
    border-radius: 232px;
    background: linear-gradient(180deg, #26272c 0%, #141518 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .icon img {
    /* Auren logo.png is bright-green on pure black, so screen blend drops the
       black and leaves only the mark over the matte background. */
    width: 730px;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
  <!-- Canonical icon source: matte dark squircle + enlarged Auren mark.
       Render with: node_modules/.bin/electron scripts/make-icon.js -->
  <div class="icon"><img src="../Auren logo.png" /></div>
</body>
</html>
